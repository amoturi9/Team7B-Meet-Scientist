<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Log in | Meet a Scientist</title><link rel="stylesheet" href="/auth.css"><script src="/auth.js" defer></script></head><body><header><a href="/">Meet a Scientist</a><a href="/account.html">My account</a></header><main><h1>Welcome back</h1><p>Log in to your saved account.</p><form data-action="login"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="username" maxlength="254" required><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required><button>Log in</button><p id="message" class="message" role="status" aria-live="polite"></p></form><p>New here? <a href="/signup.html">Create an account</a></p></main></body></html>
