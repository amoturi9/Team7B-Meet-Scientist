<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign up | Meet a Scientist</title><link rel="stylesheet" href="/auth.css"><script src="/auth.js" defer></script></head><body><header><a href="/">Meet a Scientist</a><a href="/account.html">My account</a></header><main><h1>Create your account</h1><p>Connect teachers with STEM professionals.</p><form data-action="signup"><label for="name">Full name</label><input id="name" name="name" autocomplete="name" maxlength="80" required><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" maxlength="254" required><label for="role">I am a</label><select id="role" name="role" required><option value="">Choose account type</option><option value="teacher">Teacher</option><option value="scientist">Scientist or STEM professional</option></select><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="15" maxlength="128" aria-describedby="password-help" required><small id="password-help">Use a passphrase of at least 15 characters. Maximum 128 bytes; some characters use more than one byte.</small><label for="confirm">Confirm password</label><input id="confirm" name="confirm" type="password" autocomplete="new-password" required><button>Create account</button><p id="message" class="message" role="status" aria-live="polite"></p></form><p>Already registered? <a href="/login.html">Log in</a></p></main></body></html>
